spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-jwt-secret-key-at-least-32-chars-long
jwt.expiration-ms=86400000

app.admin.email=admin@test.com
app.admin.password=admin123
app.admin.name=Admin

logging.level.org.springframework.security=WARN

app.ai.enabled=false
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
app.ai.model=gemini-3.5-flash-lite
app.ai.timeout-millis=20000
app.ai.rate-limit-per-minute=12