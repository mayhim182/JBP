spring.application.name=jbp

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/jbpdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=jbpuser
spring.datasource.password=mayankpatel
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

# JWT
jwt.secret=${JWT_SECRET:jbp-dev-secret-key-must-be-at-least-32-chars-long}
jwt.expiration-ms=86400000

# Default admin user (seeded on first startup)
app.admin.email=admin@jbp.com
app.admin.password=admin123
app.admin.name=Admin

# File storage (local disk for now; S3 later)
app.storage.location=uploads

# Resume parsing: "deterministic" for regex and dictionary rules only, or "llm" to also extract
# experience, education and projects with a model. The llm option falls back to deterministic
# whenever the model is unavailable, so switching it on cannot break uploads.
app.resume.parser=deterministic

# Multipart upload limits (resumes)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AI (Gemini). Off by default: the app must start and run fully without a key.
# Turn on per environment once app.ai.api-key is supplied.
app.ai.enabled=false
app.ai.api-key=${GEMINI_API_KEY:}
# Gemini's OpenAI-compatible endpoint, so switching provider is a config change, not code.
app.ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
# Pinned deliberately, not an alias: Story 11.2 parses structured JSON out of the reply, so the
# model must not change underneath us without a decision. Measured 2026-07-29 against the live
# endpoint, which is why the aliases are not used: gemini-flash-latest stalled for the full
# timeout and gemini-flash-lite-latest took 13.6s, while this name answered in 0.8s.
#
# A name listed by /v1beta/openai/models is NOT necessarily servable: gemini-2.5-flash is listed
# and returns 404 from chat/completions, and gemini-3.5-flash-lite is listed and never responds
# at all. So verify a replacement with a real completions call, not against the catalogue.
# Fall back to gemini-3.6-flash (1.8s) if extraction quality proves too weak.
app.ai.model=gemini-3.1-flash-lite
app.ai.timeout-millis=20000
# Upper bound on prompt size per AI task, enforced by truncation before sending.
app.ai.max-input-tokens=3000
# Kept under the free-tier requests-per-minute allowance to leave headroom.
app.ai.rate-limit-per-minute=12

# Embeddings (semantic matching, Epic 13). Same base URL and key; a different model, so a
# separate limit — free-tier quota is documented per model, and one shared window would leave
# half of each allowance unused.
app.ai.embedding-model=gemini-embedding-001
# 768, not the native 3072. Measured 2026-07-31: this model returns 3072 by default and honours a
# requested size, and a 768-dimension prefix carries 34% of the vector's energy — disproportionate
# to its 25% of the dimensions, which is what makes truncating safe rather than lossy in a way that
# matters here. Semantic similarity is 30% of a blended score that is then rounded to an integer
# 0-100, so precision past 768 cannot change a number anyone sees, while 768 is a quarter of the
# storage and a quarter of the comparison cost. Raise it here if match quality ever disappoints;
# stored vectors of a different size are treated as stale, never silently compared.
app.ai.embedding-dimensions=768
app.ai.embedding-rate-limit-per-minute=12

# Match scoring (Story 13.3, extended by 13.4). rule | embedding | hybrid.
# Still defaulting to rule: hybrid is the mode a candidate should eventually see, but the calibration band
# below is not yet trustworthy on real documents — see docs/match-scoring-comparison.md. Switching before
# that is settled would ship believable-looking wrong numbers, which is worse than keyword matching.
app.match.scorer=rule
# The rule dimensions' share of a hybrid score; meaning gets the remainder. ONE property, not two, because
# two could be configured to sum to something other than 100 and every score would silently be wrong.
# 70 is not taste: design 20 draws 35/14/11/10 against the rule rows and 30 against semantic, which is
# exactly the rule scorer's own 50/20/15/15 scaled by 0.7. Valid range 1-99.
app.match.rule-weight=70
# Cosine is NOT a percentage: two texts with nothing in common still score ~0.58, so a raw cosine would
# call an irrelevant job a 58% match. These two numbers map the usable band onto 0-100 and live in
# SemanticScoreCalibration.
# DERIVED FROM REAL DOCUMENTS by MatchScorerComparisonHarness on 2026-08-01 — see
# docs/match-scoring-comparison.md. Floor = the highest cosine any unrelated pair reached, so everything
# at or below it scores 0. Ceiling = the mean over same-role, same-wording pairs, so a real strong match
# lands near 100.
# They replace an estimated 0.55/0.90 taken from two short phrases, which was wrong at BOTH ends: 0.55 sat
# below the worst unrelated pair (irrelevant jobs scored 1-8 instead of 0) and 0.90 sat above every real
# strong pair (0.879 max), so no genuine match could ever reach 100.
# Regenerate after any embedding-model or dimension change — the band is a property of the model.
app.match.semantic-floor=0.580
app.match.semantic-ceiling=0.868

# Match explanation cache (Story 13.5). Keyed by candidate x job x scoreVersion — the highest-volume
# model call in the app, so it is cached rather than regenerated per page view.
app.match.explanation.cache-max-entries=10000
app.match.explanation.cache-ttl-minutes=30
# The negative cache. A fallback explanation (the model was unavailable, so the rule reason is showing)
# is kept only briefly: long enough that an outage cannot turn every request into a retry that burns
# the rate limit, short enough that a provider recovering is noticed within about a minute.
app.match.explanation.cache-fallback-ttl-seconds=60

# Logging
logging.level.root=INFO
logging.level.com.jbp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.file.path=logs