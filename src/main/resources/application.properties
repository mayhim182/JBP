spring.application.name=jbp

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/jbpdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=jbpuser
spring.datasource.password=mayankpatel
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

# JWT
jwt.secret=${JWT_SECRET:jbp-dev-secret-key-must-be-at-least-32-chars-long}
jwt.expiration-ms=86400000

# Default admin user (seeded on first startup)
app.admin.email=admin@jbp.com
app.admin.password=admin123
app.admin.name=Admin

# Logging
logging.level.root=INFO
logging.level.com.jbp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.file.path=logs